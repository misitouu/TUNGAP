<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童醫院外出網路測試系統 | 專業神經網路版</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 白色科技風配色 */
            --bg-base: #f4f7f9;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --sys-green: #10b981; /* 專業翡翠綠 */
            --sys-red: #ef4444;
            --sys-yellow: #f59e0b;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* 動態神經網路畫布背景 */
        #network-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none; /* 確保不會阻擋點擊 */
        }

        .container {
            width: 100%;
            max-width: 650px;
            z-index: 10;
            position: relative; /* 確保內容在畫布上方 */
        }

        /* 標題區塊 */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .header img {
            max-height: 50px;
            margin-bottom: 15px;
        }
        h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 2px;
            color: var(--text-main);
            font-weight: 800;
        }
        .subtitle {
            color: var(--sys-green);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            letter-spacing: 2px;
            margin-top: 10px;
            display: inline-block;
            padding: 6px 20px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 20px;
            border: 1px solid var(--sys-green);
        }

        /* 統一綠色呼吸燈特效 */
        @keyframes green-breathe {
            0% {
                border-color: rgba(16, 185, 129, 0.3);
                box-shadow: 0 0 5px rgba(16, 185, 129, 0.1);
            }
            50% {
                border-color: rgba(16, 185, 129, 1);
                box-shadow: 0 0 20px rgba(16, 185, 129, 0.4), inset 0 0 10px rgba(16, 185, 129, 0.1);
            }
            100% {
                border-color: rgba(16, 185, 129, 0.3);
                box-shadow: 0 0 5px rgba(16, 185, 129, 0.1);
            }
        }

        /* 儀表板卡片 */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        
        .metric-card {
            background: var(--panel-bg);
            padding: 1.5rem;
            text-align: left;
            position: relative;
            border-radius: 12px;
            border: 2px solid var(--sys-green);
            backdrop-filter: blur(8px);
            animation: green-breathe 4s infinite ease-in-out;
        }
        
        .metric-card:nth-child(1) { animation-delay: 0s; }
        .row-metrics .metric-card:nth-child(1) { animation-delay: -1.3s; }
        .row-metrics .metric-card:nth-child(2) { animation-delay: -2.6s; }

        .metric-title {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-weight: 600;
        }
        .metric-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 3.5rem;
            font-weight: bold;
            margin: 5px 0 0 0;
            color: var(--text-main);
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        .metric-value span:first-child { color: var(--sys-green); }
        .metric-unit {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: normal;
        }
        .row-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        /* 啟動按鈕 */
        .btn-start {
            width: 100%;
            padding: 1.2rem;
            font-size: 1.3rem;
            font-weight: bold;
            background: var(--panel-bg);
            color: var(--sys-green);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 3px;
            border: 2px solid var(--sys-green);
            animation: green-breathe 3s infinite ease-in-out;
            backdrop-filter: blur(8px);
        }
        
        .btn-start:hover {
            background: var(--sys-green);
            color: #fff;
            animation: none; 
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }
        .btn-start:disabled {
            border-color: var(--border-light) !important;
            color: var(--text-muted) !important;
            background: #f1f5f9 !important;
            cursor: not-allowed;
            animation: none !important;
            box-shadow: none !important;
            transform: translateY(0) !important;
        }
        
        #status {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 評估區塊 */
        .evaluation-box {
            display: none;
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: var(--panel-bg);
            border-radius: 12px;
            border: 2px solid transparent;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            backdrop-filter: blur(8px);
        }
        .eval-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        .eval-desc {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-main);
        }
        .deduction-box {
            margin-top: 15px;
            padding: 15px;
            background: rgba(248, 250, 252, 0.8);
            border-radius: 8px;
            border: 1px solid var(--border-light);
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-muted);
        }
        .val-highlight { color: var(--sys-green); font-size: 1.1rem; font-weight: bold; font-family: 'Share Tech Mono', monospace;}

        .eval-excellent { border-color: var(--sys-green); background: rgba(16,185,129,0.05); }
        .eval-excellent .eval-title { color: var(--sys-green); }
        .eval-warning { border-color: var(--sys-yellow); background: rgba(245,158,11,0.05); }
        .eval-warning .eval-title { color: var(--sys-yellow); }
        .eval-danger { border-color: var(--sys-red); background: rgba(239,68,68,0.05); }
        .eval-danger .eval-title { color: var(--sys-red); }

        /* AP 運算區塊 */
        .ap-calc-box {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: var(--panel-bg);
            border-radius: 12px;
            border: 2px solid var(--sys-green);
            display: none;
            animation: green-breathe 4s infinite ease-in-out;
            backdrop-filter: blur(8px);
        }
        .ap-calc-box h3 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: var(--sys-green);
            letter-spacing: 1px;
            text-align: center;
            font-weight: 800;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 0.8rem 1rem;
            background: #f8fafc;
            border: 2px solid var(--border-light);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 1.1rem;
            outline: none;
            text-align: center;
            transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--sys-green); box-shadow: 0 0 10px rgba(16,185,129,0.2); }
        .input-group button {
            background: var(--sys-green);
            border: none;
            color: #fff;
            border-radius: 8px;
            padding: 0 1.5rem;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-group button:hover {
            background: #059669;
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }
        #ap-result {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-light);
            font-size: 1rem;
            line-height: 1.6;
        }

        .maintainer-footer {
            position: fixed;
            bottom: 15px;
            left: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
            pointer-events: none; 
            z-index: 999;
            letter-spacing: 1px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<!-- 神經網路背景畫布 -->
<canvas id="network-bg"></canvas>

<div class="container">
    <div class="header">
        <img src="image_2.png" alt="童綜合醫院" onerror="this.style.display='none'">
        <h1>童醫院外出網路測試系統</h1>
        <div class="subtitle">CAPWAP 節點 // 頻寬評估系統</div>
    </div>
    
    <div class="dashboard">
        <div class="metric-card">
            <div class="metric-title">延遲 (Ping)</div>
            <div class="metric-value">
                <span id="ping-val">---</span>
                <span class="metric-unit">ms</span>
            </div>
        </div>
        <div class="row-metrics">
            <div class="metric-card">
                <div class="metric-title">下載頻寬 (Download)</div>
                <div class="metric-value">
                    <span id="dl-val">--.--</span>
                    <span class="metric-unit">Mbps</span>
                </div>
            </div>
            <div class="metric-card">
                <div class="metric-title">上傳頻寬 (Upload)</div>
                <div class="metric-value">
                    <span id="ul-val">--.--</span>
                    <span class="metric-unit">Mbps</span>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-start" id="start-btn" onclick="startTest()">啟動網路測試</button>
    <div id="status">系統已就緒，請點擊上方按鈕開始...</div>

    <div id="eval-box" class="evaluation-box">
        <div class="eval-title" id="eval-title">--</div>
        <div class="eval-desc" id="eval-desc">--</div>
        
        <div class="deduction-box">
            > 執行 CAPWAP / 4G-5G 耗損換算...<br>
            > 預估院內實際下載：<span id="sim-dl-text" class="val-highlight">--</span><br>
            > 預估院內實際上傳：<span id="sim-ul-text" class="val-highlight">--</span>
        </div>
    </div>

    <div id="ap-calc" class="ap-calc-box">
        <h3>設備承載與架設建議計算</h3>
        <div class="input-group">
            <input type="number" id="device-count" placeholder="請輸入外勤總設備數量 (台)" min="1">
            <button onclick="calculateAP()">計算</button>
        </div>
        <div id="ap-result"></div>
    </div>
</div>

<div class="maintainer-footer">維護人：姚鈞凱 / 74911</div>

<script>
    // =========================================
    // 神經網路背景動畫 (Canvas Animation)
    // =========================================
    const canvas = document.getElementById('network-bg');
    const ctx = canvas.getContext('2d');
    let width, height, particles;

    function initNetwork() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        // 依照螢幕大小決定神經節點數量
        const particleCount = Math.floor((width * height) / 12000); 
        
        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.8, // 稍微調快一點點讓動態更明顯
                vy: (Math.random() - 0.5) * 0.8,
                radius: Math.random() * 1.5 + 0.5
            });
        }
    }

    function animateNetwork() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            
            // 碰到邊緣反彈
            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;
            
            // 繪製神經節點 (淡灰色)
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(148, 163, 184, 0.6)'; 
            ctx.fill();
            
            // 繪製節點連線
            for (let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j];
                let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                // 距離低於 130 時產生連線
                if (dist < 130) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    // 距離越近，線條越明顯，最高透明度 0.2
                    ctx.strokeStyle = `rgba(148, 163, 184, ${0.2 - (dist / 130) * 0.2})`; 
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animateNetwork);
    }

    window.addEventListener('resize', initNetwork);
    initNetwork();
    animateNetwork();

    // =========================================
    // 測速核心邏輯 (已升級：多線程強制榨乾頻寬)
    // =========================================
    const PING_URL = 'https://cloudflare.com/cdn-cgi/trace';
    const DL_URL = 'https://speed.cloudflare.com/__down?bytes=25000000'; 
    const UL_URL = 'https://speed.cloudflare.com/__up'; 

    let globalSimDl = 0;
    let globalSimUl = 0;
    let isNetworkGood = false;

    function setStatus(text, isError = false) {
        const statusEl = document.getElementById('status');
        statusEl.innerText = text;
        if(isError) {
            statusEl.style.color = "var(--sys-red)";
        } else {
            statusEl.style.color = "var(--text-muted)";
        }
    }

    async function startTest() {
        const btn = document.getElementById('start-btn');
        const evalBox = document.getElementById('eval-box');
        const apBox = document.getElementById('ap-calc');
        
        btn.disabled = true;
        btn.innerText = '測試進行中...';
        evalBox.style.display = 'none';
        apBox.style.display = 'none';
        document.getElementById('ap-result').style.display = 'none';
        
        document.getElementById('ping-val').innerText = '---';
        document.getElementById('dl-val').innerText = '--.--';
        document.getElementById('ul-val').innerText = '--.--';

        try {
            setStatus('正在測試網路延遲 (Ping)...');
            const ping = await testPing();
            document.getElementById('ping-val').innerText = ping.toString().padStart(3, '0');

            setStatus('正在測試下載頻寬 (多通道併發)...');
            const dl = await testDownloadMultiThread();
            document.getElementById('dl-val').innerText = dl.toFixed(2).padStart(5, '0');

            setStatus('正在測試上傳頻寬 (多通道併發)...');
            const ul = await testUploadMultiThread();
            document.getElementById('ul-val').innerText = ul.toFixed(2).padStart(5, '0');

            setStatus('正在分析 CAPWAP 架設可行性...');
            analyzeNetwork(ping, dl, ul);

        } catch (error) {
            setStatus('❌ 連線失敗：請檢查 4G/5G 訊號', true);
        } finally {
            btn.disabled = false;
            btn.innerText = '重新測試網路';
        }
    }

    async function testPing() {
        const pings = [];
        for (let i = 0; i < 5; i++) {
            const start = performance.now();
            await fetch(PING_URL, { mode: 'no-cors', cache: 'no-store' });
            const end = performance.now();
            pings.push(end - start);
        }
        return Math.round(pings.reduce((a, b) => a + b) / pings.length);
    }

    // 整合多線程下載測試 (強制榨乾實體頻寬極限)
    async function testDownloadMultiThread() {
        const threads = 4; // 開啟 4 條通道
        const start = performance.now();
        const cacheBuster = '&t=' + new Date().getTime();
        const downloadPromises = [];

        for (let i = 0; i < threads; i++) {
            downloadPromises.push(
                fetch(DL_URL + cacheBuster + '&thread=' + i, { cache: 'no-store' })
                .then(async (response) => {
                    const reader = response.body.getReader();
                    let receivedLength = 0;
                    while(true) {
                        const {done, value} = await reader.read();
                        if (done) break;
                        receivedLength += value.length;
                    }
                    return receivedLength;
                })
            );
        }

        const results = await Promise.all(downloadPromises);
        const totalBytes = results.reduce((a, b) => a + b, 0);
        const end = performance.now();
        const durationInSeconds = (end - start) / 1000;
        
        const speedMbps = ((totalBytes * 8) / (1024 * 1024) / durationInSeconds);
        return parseFloat(speedMbps.toFixed(2));
    }

    // 整合多線程上傳測試
    async function testUploadMultiThread() {
        const threads = 4; // 開啟 4 條通道
        const payloadSize = 5 * 1024 * 1024; // 每通道 5MB
        const payload = new Uint8Array(payloadSize);
        for (let i = 0; i < payloadSize; i++) { payload[i] = Math.floor(Math.random() * 256); }
        
        const uploadPromises = [];
        const start = performance.now();
        
        for (let i = 0; i < threads; i++) {
            uploadPromises.push(
                fetch(UL_URL, {
                    method: 'POST',
                    body: payload,
                    headers: { 'Content-Type': 'application/octet-stream' }
                })
            );
        }

        await Promise.all(uploadPromises);
        const totalBytes = payloadSize * threads;
        const end = performance.now();
        const durationInSeconds = (end - start) / 1000;

        const speedMbps = ((totalBytes * 8) / (1024 * 1024) / durationInSeconds);
        return parseFloat(speedMbps.toFixed(2));
    }

    function analyzeNetwork(ping, dl, ul) {
        const evalBox = document.getElementById('eval-box');
        const title = document.getElementById('eval-title');
        const desc = document.getElementById('eval-desc');
        const apBox = document.getElementById('ap-calc');
        
        globalSimDl = parseFloat((dl * 0.75).toFixed(1)); 
        globalSimUl = parseFloat((ul * 0.7).toFixed(1)); 
        document.getElementById('sim-dl-text').innerText = globalSimDl + ' Mbps';
        document.getElementById('sim-ul-text').innerText = globalSimUl + ' Mbps';

        evalBox.className = 'evaluation-box';
        isNetworkGood = false;

        if (ping > 100) {
            evalBox.classList.add('eval-danger');
            title.innerText = `❌ 警告：網路延遲過高 (${ping}ms)`;
            desc.innerHTML = `高延遲將導致 CAPWAP 隧道崩潰：<br>- <strong>AP 斷線：</strong>心跳封包遺失，Cisco AP 將不斷重啟。<br>- <strong>系統異常：</strong>HIS 系統連線逾時。<br><span style="color: var(--sys-red); font-weight:bold;">> 處置建議：請將路由器移至無遮蔽處，直到 Ping < 100ms。</span>`;
        } 
        else if (globalSimUl < 10) {
            evalBox.classList.add('eval-danger');
            title.innerText = '❌ 警告：上傳頻寬嚴重不足';
            desc.innerText = '上傳頻寬極低，無法支撐多台設備回傳醫療資料。請移動路由器尋找更佳訊號點。';
        } 
        else if (ping > 60 || globalSimUl < 25) {
            evalBox.classList.add('eval-warning');
            title.innerText = '⚠️ 注意：網路堪用，需謹慎分配';
            desc.innerText = 'CAPWAP 可穩定連線，但建議避免同時傳輸大型醫療影像(PACS)。請於下方執行負載計算。';
            isNetworkGood = true;
        } 
        else {
            evalBox.classList.add('eval-excellent');
            title.innerText = '✅ 狀態：網路品質優良';
            desc.innerText = '低延遲、高頻寬。CAPWAP 協議將完美穩定運作。請於下方執行設備負載計算。';
            isNetworkGood = true;
        }

        evalBox.style.display = 'block';
        
        if (isNetworkGood) {
            setStatus('✨ 分析完成：請輸入設備數量進行評估');
            apBox.style.display = 'block';
        } else {
            setStatus('❌ 分析完成：當前環境不適合架設', true);
        }
    }

    function calculateAP() {
        const count = parseInt(document.getElementById('device-count').value);
        const resultDiv = document.getElementById('ap-result');
        
        if (!count || count <= 0) {
            alert('請輸入有效的設備數量');
            return;
        }

        // 計算需要的組數 (每組最多 15 台)
        const setsNeeded = Math.ceil(count / 15);
        
        // 算出每台路由器要分攤幾台設備
        const devicesPerRouter = count > 15 ? Math.ceil(count / setsNeeded) : count;
        
        // 所需頻寬計算
        const reqDl = devicesPerRouter * 2;
        const reqUl = devicesPerRouter * 0.5;
        
        resultDiv.style.display = 'block';
        
        if (reqDl > globalSimDl || reqUl > globalSimUl) {
            resultDiv.innerHTML = `
                <span style="color: var(--sys-red); font-weight:bold;">[ 運算結果 ] 此位置訊號無法承受分配負載</span><br><br>
                > 總設備數：${count} 台<br>
                > 建議準備架設：<span style="color: var(--text-main); font-weight:bold;">${setsNeeded} 組 (路由器 + AP)</span><br><br>
                依據數量，每組需負擔 ${devicesPerRouter} 台連線 (需 下載 ${reqDl} / 上傳 ${reqUl} Mbps)。<br>
                <strong>但您目前的測速結果過低</strong>，請尋找更佳訊號點，或增開組數分流。
            `;
        } else {
            resultDiv.innerHTML = `
                <span style="color: var(--sys-green); font-weight:bold;">[ 運算結果 ] 頻寬許可，建議如下：</span><br><br>
                > 外勤總設備數：${count} 台<br>
                > 建議準備架設：<span style="color: var(--text-main); font-size: 1.2rem; font-weight: bold;">${setsNeeded} 組</span><br>
                <span style="color: var(--text-muted); font-size: 0.85rem;">(註：1組 = 1台 4G/5G 路由器 + 1台 Cisco AP)</span><br><br>
                當前測得的網速，足以承擔這組設備分配到的負載 (${devicesPerRouter}台) 流量。
            `;
        }
    }
</script>
</body>
</html>
