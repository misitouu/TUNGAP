<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童醫院外出網路測試 | 4G/5G 訊號探測</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030305;
            --panel-bg: rgba(10, 10, 18, 0.9);
            --sys-green: #00ff66;
            --sys-red: #ff0055;
            --sys-yellow: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
        }
        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-base); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 20px; min-height: 100vh; box-sizing: border-box;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -2;
        }
        .container { width: 100%; max-width: 650px; z-index: 10; }
        
        .header { text-align: center; margin-bottom: 2.5rem; }
        .header img { max-height: 50px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.5)); }
        h1 { margin: 0; font-size: 1.6rem; letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px #00f0ff; }
        .subtitle {
            color: #fff; font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; letter-spacing: 2px;
            margin-top: 10px; display: inline-block; padding: 6px 20px;
            background: rgba(0, 0, 0, 0.6); border-radius: 20px; border: 2px solid #00f0ff;
        }

        .dashboard { display: flex; flex-direction: column; gap: 1.2rem; margin-bottom: 2rem; }
        .metric-card {
            background: var(--panel-bg); padding: 1.5rem; border-radius: 14px;
            border: 2px solid rgba(0, 240, 255, 0.3); box-shadow: 0 0 15px rgba(0,240,255,0.1);
        }
        .metric-title { font-size: 0.9rem; color: var(--text-muted); font-weight: bold; }
        .metric-value {
            font-family: 'Share Tech Mono', monospace; font-size: 3.5rem;
            margin: 5px 0 0 0; color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.6);
            display: flex; align-items: baseline; gap: 10px;
        }
        .metric-unit { font-size: 1.2rem; color: var(--text-muted); font-family: sans-serif; }
        .row-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }

        .btn-start {
            width: 100%; padding: 1.2rem; font-size: 1.3rem; font-weight: bold;
            background: rgba(10, 10, 18, 0.9); color: #00ff66; border-radius: 50px; cursor: pointer;
            border: 3px solid #00ff66; box-shadow: 0 0 15px rgba(0,255,102,0.3); transition: 0.2s;
        }
        .btn-start:hover { background: #00ff66; color: #000; box-shadow: 0 0 30px #00ff66; }
        .btn-start:disabled { border-color: #333; color: #555; cursor: not-allowed; box-shadow: none; }
        
        #status { text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-weight: bold; }

        .ap-calc-box {
            margin-top: 1.5rem; padding: 1.5rem; background: var(--panel-bg); border-radius: 14px;
            border: 2px dashed #00f0ff; display: none;
        }
        .ap-calc-box h3 { margin: 0 0 15px 0; color: #00f0ff; text-align: center; }
        .input-group { display: flex; gap: 10px; }
        .input-group input { flex: 1; padding: 0.8rem; background: #000; border: 1px solid #555; color: #fff; text-align: center; font-size: 1.1rem; }
        .input-group button { background: #111; border: 1px solid #00f0ff; color: #00f0ff; padding: 0 1.5rem; font-weight: bold; cursor: pointer; }
        #ap-result { margin-top: 15px; padding-top: 15px; border-top: 1px solid #444; line-height: 1.6; }

        .maintainer-footer { position: fixed; bottom: 15px; left: 15px; font-size: 0.8rem; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- 記得確認圖片名稱是 tung.jpg 還是 image_2.png -->
        <img src="tung.jpg" alt="童綜合醫院" onerror="this.style.display='none'">
        <h1>童醫院外出網路測試系統</h1>
        <div class="subtitle">4G/5G 物理極限探測 (多線程)</div>
    </div>
    
    <div class="dashboard">
        <div class="metric-card">
            <div class="metric-title">訊號延遲 (Ping)</div>
            <div class="metric-value"><span id="ping-val">---</span><span class="metric-unit">ms</span></div>
        </div>
        <div class="row-metrics">
            <div class="metric-card">
                <div class="metric-title">極限下載 (DL)</div>
                <div class="metric-value"><span id="dl-val">--.--</span><span class="metric-unit">Mbps</span></div>
            </div>
            <div class="metric-card">
                <div class="metric-title">極限上傳 (UL)</div>
                <div class="metric-value"><span id="ul-val">--.--</span><span class="metric-unit">Mbps</span></div>
            </div>
        </div>
    </div>

    <button class="btn-start" id="start-btn" onclick="startTest()">啟動 4G/5G 訊號探測</button>
    <div id="status">系統就緒，請拿著路由器至預定架設點測試</div>

    <div id="ap-calc" class="ap-calc-box">
        <h3>設備承載與架設建議</h3>
        <div class="input-group">
            <input type="number" id="device-count" placeholder="請輸入外勤總設備數量 (台)" min="1">
            <button onclick="calculateAP()">計算</button>
        </div>
        <div id="ap-result"></div>
    </div>
</div>

<div class="maintainer-footer">維護人：姚鈞凱 / 74911</div>

<script>
    const PING_URL = 'https://cloudflare.com/cdn-cgi/trace';
    const DL_URL = 'https://speed.cloudflare.com/__down?bytes=25000000'; 
    const UL_URL = 'https://speed.cloudflare.com/__up'; 

    let globalRawDl = 0;
    let globalRawUl = 0;

    function setStatus(text) { document.getElementById('status').innerText = text; }

    async function startTest() {
        const btn = document.getElementById('start-btn');
        const apBox = document.getElementById('ap-calc');
        
        btn.disabled = true;
        btn.innerText = '測速引擎全力運轉中...';
        apBox.style.display = 'none';
        document.getElementById('ap-result').style.display = 'none';
        
        document.getElementById('ping-val').innerText = '---';
        document.getElementById('dl-val').innerText = '--.--';
        document.getElementById('ul-val').innerText = '--.--';

        try {
            setStatus('正在探測基地台延遲 (Ping)...');
            const ping = await testPing();
            document.getElementById('ping-val').innerText = ping.toString().padStart(3, '0');

            setStatus('正在多線程轟炸下載極限 (Download)...');
            const dl = await testDownloadMultiThread();
            globalRawDl = dl;
            document.getElementById('dl-val').innerText = dl.toFixed(2).padStart(5, '0');

            setStatus('正在多線程測試上傳極限 (Upload)...');
            const ul = await testUploadMultiThread();
            globalRawUl = ul;
            document.getElementById('ul-val').innerText = ul.toFixed(2).padStart(5, '0');

            setStatus('✨ 訊號探測完成。請輸入設備數量進行評估。');
            apBox.style.display = 'block';

        } catch (error) {
            setStatus('❌ 連線失敗：請檢查 4G/5G 訊號');
            document.getElementById('status').style.color = "#ff0055";
        } finally {
            btn.disabled = false;
            btn.innerText = '重新測試此位置訊號';
        }
    }

    async function testPing() {
        const pings = [];
        for (let i = 0; i < 5; i++) {
            const start = performance.now();
            await fetch(PING_URL, { mode: 'no-cors', cache: 'no-store' });
            pings.push(performance.now() - start);
        }
        return Math.round(pings.reduce((a, b) => a + b) / pings.length);
    }

    // 🌟 多線程下載測試 (逼近 Speedtest 的關鍵)
    async function testDownloadMultiThread() {
        const threads = 6; // 同時開啟 6 條通道
        const start = performance.now();
        let totalReceived = 0;

        const promises = Array.from({length: threads}).map(async () => {
            const cacheBuster = '&t=' + Math.random();
            const response = await fetch(DL_URL + cacheBuster, { cache: 'no-store' });
            const reader = response.body.getReader();
            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                totalReceived += value.length;
            }
        });

        await Promise.all(promises);
        const duration = (performance.now() - start) / 1000;
        const speedMbps = ((totalReceived * 8) / duration) / (1024 * 1024);
        return parseFloat(speedMbps.toFixed(2));
    }

    // 🌟 多線程上傳測試
    async function testUploadMultiThread() {
        const threads = 3; // 上傳通道
        const payloadSize = 5 * 1024 * 1024; 
        const payload = new Uint8Array(payloadSize);
        for (let i = 0; i < payloadSize; i++) { payload[i] = Math.floor(Math.random() * 256); }
        
        const start = performance.now();
        const promises = Array.from({length: threads}).map(() => 
            fetch(UL_URL, { method: 'POST', body: payload, headers: { 'Content-Type': 'application/octet-stream' }})
        );

        await Promise.all(promises);
        const duration = (performance.now() - start) / 1000;
        const speedMbps = ((payloadSize * threads * 8) / duration) / (1024 * 1024);
        return parseFloat(speedMbps.toFixed(2));
    }

    function calculateAP() {
        const count = parseInt(document.getElementById('device-count').value);
        const resultDiv = document.getElementById('ap-result');
        if (!count || count <= 0) { alert('請輸入有效的設備數量'); return; }

        // 每組設備負擔上限 15 台
        const setsNeeded = Math.ceil(count / 15);
        const devicesPerRouter = count > 15 ? Math.ceil(count / setsNeeded) : count;
        
        // 考慮 CAPWAP 耗損，我們將原本的物理極速打 7 折來做安全評估
        const safeDl = globalRawDl * 0.7;
        const safeUl = globalRawUl * 0.7;
        
        const reqDl = devicesPerRouter * 2;
        const reqUl = devicesPerRouter * 0.5;
        
        resultDiv.style.display = 'block';
        
        if (reqDl > safeDl || reqUl > safeUl) {
            resultDiv.innerHTML = `
                <span style="color: #ff0055; font-weight:bold;">[ ⚠️ 警告 ] 此位置 4G/5G 訊號過弱</span><br><br>
                依據總數 ${count} 台，每組路由器需負擔 ${devicesPerRouter} 台連線。<br>
                扣除 CAPWAP 加密耗損後，此處的實體訊號無法支撐負載。<br>
                <span style="color: #ffcc00;">> 請移動路由器至窗邊或戶外尋找更佳訊號。</span>
            `;
        } else {
            resultDiv.innerHTML = `
                <span style="color: #00ff66; font-weight:bold;">[ ✅ 允許 ] 訊號強度足以建立 CAPWAP 隧道</span><br><br>
                > 外勤總設備數：${count} 台<br>
                > 建議準備架設：<span style="color: #00f0ff; font-size: 1.2rem; font-weight: bold;">${setsNeeded} 組</span> (4G路由器+AP)<br><br>
                此位置的 4G/5G 物理訊號優良，足以承擔分配到的負載流量，請直接於此處架設。
            `;
        }
    }
</script>
</body>
</html>
